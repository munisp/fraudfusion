# Verification pipeline: migration idempotency harness, Python service tests,
# Go build/vet/test, and frontend type-checks.
# Complements platform-quality.yml (lint/compile gates) with executable proof.
name: Verify

on:
  pull_request:
  push:
    branches: [main, audit-remediation]

permissions:
  contents: read

jobs:
  migration-harness:
    # Applies every database/*.sql twice (idempotency) on a real embedded
    # PostgreSQL, then runs the SQL verification suites and the multi-tenant
    # ledger stress test. No docker required (pgserver ships its own PG).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pgserver
        run: pip install pgserver
      - name: Run embedded-PG migration harness (double-apply + verification + stress)
        env:
          XDG_RUNTIME_DIR: /tmp/xdg
        run: python3 database/tests/run_migrations_embedded_pg.py

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pytest
        run: pip install pytest
      - name: pytest over services/python/*/tests
        run: |
          set -euo pipefail
          for d in services/python/*/; do
            [ -d "$d/tests" ] || continue
            [ -f "$d/requirements.txt" ] && pip install -r "$d/requirements.txt"
            [ -f "$d/requirements-dev.txt" ] && pip install -r "$d/requirements-dev.txt"
            echo "== pytest $d"
            (cd "$d" && python -m pytest tests/ -q)
          done
      - name: ml tests
        run: |
          set -euo pipefail
          pip install -r ml/requirements.txt
          python -m pytest ml/tests -q

  go-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt gate (unformatted code fails the build)
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l services/go orchestrator/go database/cmd 2>/dev/null || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt violations:"; echo "$unformatted"; exit 1
          fi
      - name: build, vet, and test every services/go module
        run: |
          set -euo pipefail
          for d in services/go/*/; do
            [ -f "$d/go.mod" ] || continue
            echo "== go build/vet/test $d"
            (cd "$d" && go build ./... && go vet ./... && go test ./...)
          done

  rust-detectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt, clippy, and test the Rust fraud-signals port
        working-directory: services/rust/fraud-signals
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: install, type-check, and test the TypeScript SDK
        working-directory: sdks/typescript
        run: |
          set -euo pipefail
          npm ci
          npm test

  land-verification-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: land-verification-service tests (lives outside services/python)
        working-directory: services/land-verification-service
        run: |
          set -euo pipefail
          pip install -r requirements.txt pytest
          python -m pytest -q

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/kyc-frontend/package-lock.json
            implementations/backoffice-ui/package-lock.json
            ml-onboarding-portal/package-lock.json
      - name: type-check every frontend that has a package.json
        run: |
          set -euo pipefail
          for d in frontend frontend/kyc-frontend implementations/backoffice-ui ml-onboarding-portal; do
            if [ -f "$d/package.json" ]; then
              echo "== typecheck $d"
              (cd "$d" && npm ci && (npm run type-check || npx tsc --noEmit))
            fi
          done
