name: Mobile and Go Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/react-native/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/verify-production-source.mjs
      - run: npm test -- --coverage --runInBand
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: mobile/react-native/coverage
          if-no-files-found: warn

  local-contract-smoke:
    runs-on: ubuntu-24.04
    needs: mobile-quality
    defaults:
      run:
        working-directory: local-e2e
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: curl --fail --retry 10 --retry-connrefused http://localhost:8088/healthz
      - run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/v1/mobile/dashboard)" = "401"
      - run: >-
          curl --fail -H 'Authorization: Bearer local-contract-token' http://localhost:8088/api/v1/mobile/dashboard
      - run: >-
          curl --fail -X POST -H 'Authorization: Bearer local-contract-token' http://localhost:8088/api/v1/kyc/sessions
      - run: docker compose down -v
        if: always()

  go-race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
      - name: Test each declared Go module with race detection
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            echo "Testing $module"
            (cd "$module" && go test -race ./...)
          done < <({ find services/go orchestrator/go -name go.mod -printf '%h\n' 2>/dev/null; printf '%s\n' observability/release-gate-metrics; } | sort -u)

  dependency-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/react-native/package-lock.json
      - name: Audit production mobile dependencies
        working-directory: mobile/react-native
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
      - name: Scan reachable Go vulnerabilities
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          while IFS= read -r module; do
            (cd "$module" && govulncheck ./...)
          done < <({ find services/go orchestrator/go -name go.mod -printf '%h\n' 2>/dev/null; printf '%s\n' observability/release-gate-metrics; } | sort -u)


  release-gate-notification:
    runs-on: ubuntu-24.04
    needs: [mobile-quality, local-contract-smoke, go-race, dependency-security]
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.mobile-quality.result == 'failure' || needs.local-contract-smoke.result == 'failure' || needs.go-race.result == 'failure' || needs.dependency-security.result == 'failure') }}
    permissions:
      contents: read
    env:
      RELEASE_GATE_ALERT_WEBHOOK: ${{ secrets.RELEASE_GATE_ALERT_WEBHOOK }}
    steps:
      - name: Notify release-gate failure without sensitive logs
        if: ${{ env.RELEASE_GATE_ALERT_WEBHOOK != '' }}
        env:
          MOBILE_QUALITY_RESULT: ${{ needs.mobile-quality.result }}
          CONTRACT_RESULT: ${{ needs.local-contract-smoke.result }}
          GO_RACE_RESULT: ${{ needs.go-race.result }}
          DEPENDENCY_SECURITY_RESULT: ${{ needs.dependency-security.result }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg event "fraudfusion_release_gate_failure" \
            --arg repository "$REPOSITORY" \
            --arg run_id "$RUN_ID" \
            --arg sha "$SHA" \
            --arg mobile_quality "$MOBILE_QUALITY_RESULT" \
            --arg local_contract_smoke "$CONTRACT_RESULT" \
            --arg go_race "$GO_RACE_RESULT" \
            --arg dependency_security "$DEPENDENCY_SECURITY_RESULT" \
            '{event:$event,repository:$repository,run_id:$run_id,sha:$sha,gates:{mobile_quality:$mobile_quality,local_contract_smoke:$local_contract_smoke,go_race:$go_race,dependency_security:$dependency_security}}')"
          curl --fail --silent --show-error --retry 3 \
            --connect-timeout 5 --max-time 15 \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_GATE_ALERT_WEBHOOK"


  release-gate-metrics:
    runs-on: ubuntu-24.04
    needs: [mobile-quality, local-contract-smoke, go-race, dependency-security]
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    env:
      RELEASE_GATE_METRICS_URL: ${{ secrets.RELEASE_GATE_METRICS_URL }}
      RELEASE_GATE_INGEST_HMAC_SECRET: ${{ secrets.RELEASE_GATE_INGEST_HMAC_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Emit signed bounded gate outcomes to staging metrics service
        if: ${{ env.RELEASE_GATE_METRICS_URL != '' && env.RELEASE_GATE_INGEST_HMAC_SECRET != '' }}
        env:
          MOBILE_QUALITY_RESULT: ${{ needs.mobile-quality.result }}
          CONTRACT_RESULT: ${{ needs.local-contract-smoke.result }}
          GO_RACE_RESULT: ${{ needs.go-race.result }}
          DEPENDENCY_SECURITY_RESULT: ${{ needs.dependency-security.result }}
        run: |
          set -euo pipefail
          chmod 700 observability/release-gate-metrics/report-ci-results.sh
          observability/release-gate-metrics/report-ci-results.sh
