name: Mobile and Go Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/react-native/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/verify-production-source.mjs
      - run: npm test -- --coverage --runInBand
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: mobile/react-native/coverage
          if-no-files-found: warn

  local-contract-smoke:
    runs-on: ubuntu-24.04
    needs: mobile-quality
    defaults:
      run:
        working-directory: local-e2e
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: curl --fail --retry 10 --retry-connrefused http://localhost:8088/healthz
      - run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/v1/mobile/dashboard)" = "401"
      - run: >-
          curl --fail -H 'Authorization: Bearer local-contract-token' http://localhost:8088/api/v1/mobile/dashboard
      - run: >-
          curl --fail -X POST -H 'Authorization: Bearer local-contract-token' http://localhost:8088/api/v1/kyc/sessions
      - run: docker compose down -v
        if: always()

  go-race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: |
            services/go/**/go.sum
            orchestrator/go/**/go.sum
            observability/release-gate-metrics/go.sum
      - name: Test each declared Go module with race detection
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            echo "Testing $module"
            (cd "$module" && go test -race ./...)
          done < <({ find services/go orchestrator/go -name go.mod -printf '%h\n' 2>/dev/null; printf '%s\n' observability/release-gate-metrics; } | sort -u)

  dependency-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/react-native/package-lock.json
      - name: Audit production mobile dependencies
        working-directory: mobile/react-native
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: |
            services/go/**/go.sum
            orchestrator/go/**/go.sum
            observability/release-gate-metrics/go.sum
      - name: Scan reachable Go vulnerabilities
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          while IFS= read -r module; do
            (cd "$module" && govulncheck ./...)
          done < <({ find services/go orchestrator/go -name go.mod -printf '%h\n' 2>/dev/null; printf '%s\n' observability/release-gate-metrics; } | sort -u)


  ledger_postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fraudfusion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fraudfusion_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: fraudfusion_ci
      LEDGER_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fraudfusion_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: services/go/ledger-command/go.sum
      - name: Apply ordered financial-control migrations
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/chargeback_fraud_schema.sql
          psql -v ON_ERROR_STOP=1 -f database/20260820_chargeback_persistence_hardening.sql
          psql -v ON_ERROR_STOP=1 -f database/20260822_chargeback_funds_flow_integrity.sql
          psql -v ON_ERROR_STOP=1 -f database/20260822_double_entry_ledger_settlement_reconciliation.sql
          psql -v ON_ERROR_STOP=1 -f database/20260822_ledger_outbox_and_financial_close.sql
          psql -v ON_ERROR_STOP=1 -f database/20260822_financial_control_service_runtime.sql
      - name: Verify financial database invariants
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/tests/20260822_ledger_integrity_verification.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/20260822_financial_close_verification.sql
      - name: Run ledger command PostgreSQL integration suite
        working-directory: services/go/ledger-command
        run: go test -race ./...
      - name: Run bounded concurrent multi-tenant ledger stress gate
        env:
          LEDGER_STRESS_TENANTS: '6'
          LEDGER_STRESS_TRANSACTIONS_PER_TENANT: '20'
          LEDGER_STRESS_CONCURRENCY: '12'
        run: database/tests/run_ledger_multitenant_stress.sh

  ledger_container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable ledger control service container
        run: docker build --pull --tag fraudfusion/ledger-control-service:ci services/go/ledger-command

  ledger_manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Render immutable ledger deployment manifest
        env:
          LEDGER_IMAGE_REFERENCE: registry.example.test/fraudfusion/ledger-control-service@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          LEDGER_INGRESS_CLASS: nginx
          LEDGER_HOSTNAME: ledger-control.staging.example.test
          LEDGER_TLS_SECRET_NAME: ledger-control-service-tls
        run: |
          set -euo pipefail
          chmod 700 deploy/kubernetes/render-ledger-control-manifest.sh
          deploy/kubernetes/render-ledger-control-manifest.sh > /tmp/ledger-control-service.yaml
          test "$(grep -c '^---$' /tmp/ledger-control-service.yaml)" -ge 7
          ! grep -q '__LEDGER_' /tmp/ledger-control-service.yaml
      - name: Verify non-root ledger container metadata
        run: |
          set -euo pipefail
          docker build --pull --tag fraudfusion/ledger-control-service:manifest-check services/go/ledger-command
          test "$(docker image inspect fraudfusion/ledger-control-service:manifest-check --format '{{.Config.User}}')" = "nonroot:nonroot"

  release-gate-notification:
    runs-on: ubuntu-24.04
    needs: [mobile-quality, local-contract-smoke, go-race, dependency-security, ledger_postgres, ledger_container, ledger_manifest]
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.mobile-quality.result == 'failure' || needs.local-contract-smoke.result == 'failure' || needs.go-race.result == 'failure' || needs.dependency-security.result == 'failure' || needs.ledger_postgres.result == 'failure' || needs.ledger_container.result == 'failure' || needs.ledger_manifest.result == 'failure') }}
    permissions:
      contents: read
    env:
      RELEASE_GATE_ALERT_WEBHOOK: ${{ secrets.RELEASE_GATE_ALERT_WEBHOOK }}
    steps:
      - name: Notify release-gate failure without sensitive logs
        if: ${{ env.RELEASE_GATE_ALERT_WEBHOOK != '' }}
        env:
          MOBILE_QUALITY_RESULT: ${{ needs.mobile-quality.result }}
          CONTRACT_RESULT: ${{ needs.local-contract-smoke.result }}
          GO_RACE_RESULT: ${{ needs.go-race.result }}
          DEPENDENCY_SECURITY_RESULT: ${{ needs.dependency-security.result }}
          LEDGER_POSTGRES_RESULT: ${{ needs.ledger_postgres.result }}
          LEDGER_CONTAINER_RESULT: ${{ needs.ledger_container.result }}
          LEDGER_MANIFEST_RESULT: ${{ needs.ledger_manifest.result }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg event "fraudfusion_release_gate_failure" \
            --arg repository "$REPOSITORY" \
            --arg run_id "$RUN_ID" \
            --arg sha "$SHA" \
            --arg mobile_quality "$MOBILE_QUALITY_RESULT" \
            --arg local_contract_smoke "$CONTRACT_RESULT" \
            --arg go_race "$GO_RACE_RESULT" \
            --arg dependency_security "$DEPENDENCY_SECURITY_RESULT" \
            --arg ledger_postgres "$LEDGER_POSTGRES_RESULT" \
            --arg ledger_container "$LEDGER_CONTAINER_RESULT" \
            --arg ledger_manifest "$LEDGER_MANIFEST_RESULT" \
            '{event:$event,repository:$repository,run_id:$run_id,sha:$sha,gates:{mobile_quality:$mobile_quality,local_contract_smoke:$local_contract_smoke,go_race:$go_race,dependency_security:$dependency_security,ledger_postgres:$ledger_postgres,ledger_container:$ledger_container,ledger_manifest:$ledger_manifest}}')"
          curl --fail --silent --show-error --retry 3 \
            --connect-timeout 5 --max-time 15 \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_GATE_ALERT_WEBHOOK"


  release-gate-metrics:
    runs-on: ubuntu-24.04
    needs: [mobile-quality, local-contract-smoke, go-race, dependency-security, ledger_postgres, ledger_container, ledger_manifest]
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    env:
      RELEASE_GATE_METRICS_URL: ${{ secrets.RELEASE_GATE_METRICS_URL }}
      RELEASE_GATE_INGEST_HMAC_SECRET: ${{ secrets.RELEASE_GATE_INGEST_HMAC_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Emit signed bounded gate outcomes to staging metrics service
        if: ${{ env.RELEASE_GATE_METRICS_URL != '' && env.RELEASE_GATE_INGEST_HMAC_SECRET != '' }}
        env:
          MOBILE_QUALITY_RESULT: ${{ needs.mobile-quality.result }}
          CONTRACT_RESULT: ${{ needs.local-contract-smoke.result }}
          GO_RACE_RESULT: ${{ needs.go-race.result }}
          DEPENDENCY_SECURITY_RESULT: ${{ needs.dependency-security.result }}
          LEDGER_POSTGRES_RESULT: ${{ needs.ledger_postgres.result }}
          LEDGER_CONTAINER_RESULT: ${{ needs.ledger_container.result }}
          LEDGER_MANIFEST_RESULT: ${{ needs.ledger_manifest.result }}
        run: |
          set -euo pipefail
          chmod 700 observability/release-gate-metrics/report-ci-results.sh
          observability/release-gate-metrics/report-ci-results.sh
