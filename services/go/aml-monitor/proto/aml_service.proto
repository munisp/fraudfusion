syntax = "proto3";

package aml;

option go_package = "aml-monitor/proto;proto";

service AMLService {
  rpc AnalyzeTransaction(TransactionRequest) returns (TransactionResponse);
  rpc DetectSuspiciousPattern(PatternRequest) returns (PatternResponse);
  rpc GenerateSAR(SARRequest) returns (SARResponse);
  rpc CheckSanctions(SanctionsRequest) returns (SanctionsResponse);
  rpc VerifySourceOfFunds(SourceOfFundsRequest) returns (SourceOfFundsResponse);
}

message TransactionRequest {
  string transaction_id = 1;
  string user_id = 2;
  double amount = 3;
  string currency = 4;
  string transaction_type = 5;
  string country_code = 6;
  int64 timestamp = 7;
}

message TransactionResponse {
  string transaction_id = 1;
  double risk_score = 2;
  string risk_level = 3;
  repeated string risk_factors = 4;
  bool flagged = 5;
  bool sar_required = 6;
  string recommendation = 7;
  map<string, double> detailed_scores = 8;
}

message PatternRequest {
  string user_id = 1;
  int32 days_lookback = 2;
}

message Pattern {
  string pattern_type = 1;
  string description = 2;
  double confidence = 3;
  repeated string transaction_ids = 4;
  double total_amount = 5;
}

message PatternResponse {
  string user_id = 1;
  repeated Pattern patterns = 2;
  double overall_risk_score = 3;
  bool suspicious = 4;
}

message SARRequest {
  string user_id = 1;
  repeated string transaction_ids = 2;
  string suspicious_activity_type = 3;
  string narrative = 4;
}

message SARResponse {
  string sar_id = 1;
  string user_id = 2;
  string filing_institution = 3;
  string suspicious_activity_type = 4;
  string narrative = 5;
  int64 filing_date = 6;
  string status = 7;
  repeated string transactions = 8;
}

message SanctionsRequest {
  string entity_name = 1;
  string entity_type = 2;
}

message SanctionsResponse {
  bool is_sanctioned = 1;
  repeated string matches = 2;
  double confidence = 3;
}

message SourceOfFundsRequest {
  string user_id = 1;
  double amount = 2;
  string declared_source = 3;
  repeated string supporting_documents = 4;
}

message SourceOfFundsResponse {
  bool verified = 1;
  double confidence_score = 2;
  string verification_method = 3;
  repeated string discrepancies = 4;
  string recommendation = 5;
}
