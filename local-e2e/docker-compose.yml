# Local contract-test / integration environment (not production).
# Base stack: postgres + go-mobile-mock (the contract API under test).
# Extended stack: redis, keycloak, permify, mlflow, aml-ml-service so local
# journeys exercise the same infrastructure seams as staging.
#
# Notes:
#   - Keycloak realm import: deploy/keycloak/fraudfusion-realm.json exists and
#     is mounted below; it is imported at startup via --import-realm.
#   - MLflow mirrors mlops/mlflow/docker-compose.yml on the shared e2e network.
#   - aml-ml-service builds from the repo root (mlops/serving/Dockerfile) and
#     falls back to its rule-based scorer when the ONNX artifact is absent.
#   - temporal-orchestrator is a pure Temporal worker (no HTTP port); the dev
#     Temporal server is temporalio/auto-setup (embedded SQLite, not for prod).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraudfusion_e2e
      POSTGRES_USER: fraudfusion
      POSTGRES_PASSWORD: local_e2e_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudfusion -d fraudfusion_e2e"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "54329:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    networks: [fraudfusion-e2e]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6380:6379"
    networks: [fraudfusion-e2e]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local_e2e_only
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    # deploy/keycloak/fraudfusion-realm.json is imported at startup.
    volumes:
      - ../deploy/keycloak/fraudfusion-realm.json:/opt/keycloak/data/import/fraudfusion-realm.json:ro
    healthcheck:
      # ubi9-minimal ships curl-minimal; management port 9000 exposes health.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "8180:8080"
    networks: [fraudfusion-e2e]

  permify:
    image: permify/permify:v1.2.9
    command: ["serve"]
    environment:
      PERMIFY_DATABASE_ENGINE: memory
    healthcheck:
      # The Permify image is distroless (no shell/curl); this is a
      # process-level check. Port-level readiness is covered by the
      # contract script retries.
      test: ["CMD", "/app/permify", "version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "3476:3476"
      - "3478:3478"
    networks: [fraudfusion-e2e]

  mlflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow_local_e2e}
      POSTGRES_DB: mlflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mlflow_db_e2e_data:/var/lib/postgresql/data
    networks: [fraudfusion-e2e]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.2
    depends_on:
      mlflow-db:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://mlflow:${MLFLOW_DB_PASSWORD:-mlflow_local_e2e}@mlflow-db:5432/mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://mlflow:${MLFLOW_DB_PASSWORD:-mlflow_local_e2e}@mlflow-db:5432/mlflow
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_artifacts_e2e:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "5000:5000"
    networks: [fraudfusion-e2e]

  aml-ml-service:
    build:
      context: ..
      dockerfile: mlops/serving/Dockerfile
    environment:
      PORT: "8100"
      # No ONNX artifact is mounted in the local stack; the service starts in
      # its documented rule-fallback mode and reports model_mode=rule_fallback.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8100:8100"
    networks: [fraudfusion-e2e]

  aml-monitor:
    build:
      context: ../services/go/aml-monitor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      aml-ml-service:
        condition: service_healthy
    environment:
      PORT: "8081"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: fraudfusion
      DB_PASSWORD: local_e2e_only
      DB_NAME: fraudfusion_e2e
      # Compose postgres has no TLS; aml-monitor refuses sslmode=disable
      # without this explicit local-only override.
      DB_SSLMODE: disable
      DB_ALLOW_INSECURE: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # In-cluster/plaintext Keycloak over http:8080 matches the compose
      # keycloak (KC_HTTP_ENABLED=true); KEYCLOAK_INSECURE_HTTP mirrors the
      # k8s detectors.yaml wiring.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_INSECURE_HTTP: "true"
      KEYCLOAK_REALM: fraudfusion
      KEYCLOAK_CLIENT_ID: aml-monitor
      KEYCLOAK_CLIENT_SECRET: ${AML_MONITOR_CLIENT_SECRET:-local_e2e_only}
      AML_ML_SERVICE_URL: http://aml-ml-service:8100
    # No container healthcheck: the aml-monitor image is distroless (no
    # shell/curl/wget). Readiness is covered by the /api/v1/aml/health route
    # and the contract script's retries.
    ports:
      - "8081:8081"
    networks: [fraudfusion-e2e]

  go-mobile-mock:
    build:
      context: ./go-mobile-mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fraudfusion:local_e2e_only@postgres:5432/fraudfusion_e2e?sslmode=disable
      LOCAL_E2E_TOKEN: local-contract-token
    ports:
      - "8088:8080"
    networks: [fraudfusion-e2e]

  model-router:
    build:
      context: ..
      dockerfile: mlops/serving/Dockerfile.model-router
      args:
        # Both arms point at the local aml-ml-service; swap the challenger URL
        # when running a second model version.
        CHAMPION_URL: http://aml-ml-service:8100/v1/aml/score
        CHALLENGER_URL: http://aml-ml-service:8100/v1/aml/score
    depends_on:
      aml-ml-service:
        condition: service_healthy
    environment:
      PORT: "8200"
      EXPERIMENT_CONFIG: /app/config/experiments.yaml
      ROUTER_LOG_DIR: /app/data/router
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8200/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8200:8200"
    networks: [fraudfusion-e2e]

  land-verification-service:
    build:
      context: ../services/land-verification-service
    environment:
      PORT: "8002"
      # SQLite by default in local e2e (no DATABASE_URL); auth requires a
      # Keycloak bearer token from the compose keycloak.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: fraudfusion
      KEYCLOAK_INSECURE_HTTP: "true"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8002:8002"
    networks: [fraudfusion-e2e]

  onboarding-service:
    build:
      context: ../services/python/onboarding-service
    environment:
      PORT: "8085"
      # SQLite default (no DATABASE_URL) keeps the local stack self-contained.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: fraudfusion
      KEYCLOAK_CLIENT_ID: onboarding-service
      KEYCLOAK_CLIENT_SECRET: ${ONBOARDING_CLIENT_SECRET:-local_e2e_only}
      KEYCLOAK_INSECURE_HTTP: "true"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8085/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8085:8085"
    networks: [fraudfusion-e2e]

  temporal:
    image: temporalio/auto-setup:1.25.2
    ports:
      - "7233:7233"
    networks: [fraudfusion-e2e]

  temporal-orchestrator:
    build:
      context: ../services/go/temporal-orchestrator
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_HOST: temporal:7233
      SERVICE_LAND_VERIFICATION_SERVICE_URL: http://land-verification-service:8002
    # The worker is a long-running process without an HTTP listener;
    # healthcheck is process liveness only.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 12
    networks: [fraudfusion-e2e]

networks:
  fraudfusion-e2e:
    driver: bridge

volumes:
  postgres_e2e_data:
  mlflow_db_e2e_data:
  mlflow_artifacts_e2e:
