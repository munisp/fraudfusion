groups:
  - name: fraudfusion.release_gates
    interval: 30s
    rules:
      - record: fraudfusion_release_gate_failures
        expr: fraudfusion_release_gate_failures_total
      - alert: FraudFusionVulnerabilityGateFailure
        expr: increase(fraudfusion_release_gate_failures_total{environment="staging",gate="dependency-security"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
          service: fraudfusion-ci
          release_gate: dependency-security
        annotations:
          summary: "FraudFusion dependency-security gate failed"
          description: "A CI run reported a production dependency vulnerability at or above the configured high threshold. Promotion must remain blocked until the audit passes."
          runbook_url: "https://runbooks.example.invalid/fraudfusion/vulnerability-gate"

      - alert: FraudFusionGoVulnerabilityGateFailure
        expr: increase(fraudfusion_release_gate_failures_total{environment="staging",gate="govulncheck"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
          service: fraudfusion-ci
          release_gate: govulncheck
        annotations:
          summary: "FraudFusion Go vulnerability scan failed"
          description: "A reachable Go vulnerability was reported by govulncheck. Promotion must remain blocked until remediation and a clean rescan."
          runbook_url: "https://runbooks.example.invalid/fraudfusion/go-vulnerability-gate"

      - alert: FraudFusionIntegrationRegression
        expr: increase(fraudfusion_e2e_scenario_total{environment=~"staging|production",result="failure"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
          service: fraudfusion-e2e
          release_gate: integration
        annotations:
          summary: "FraudFusion mobile-to-backend integration scenario failed"
          description: "An authenticated staging or production smoke scenario failed. Do not promote until the failed scenario is triaged and rerun successfully."
          runbook_url: "https://runbooks.example.invalid/fraudfusion/integration-regression"

      - alert: FraudFusionUnauthorizedSpike
        expr: sum(rate(fraudfusion_http_requests_total{environment="production",status=~"401|403"}[5m])) / clamp_min(sum(rate(fraudfusion_http_requests_total{environment="production"}[5m])), 0.001) > 0.20
        for: 10m
        labels:
          severity: warning
          service: fraudfusion-api
        annotations:
          summary: "FraudFusion authorization-denial ratio elevated"
          description: "More than 20% of production requests returned 401 or 403 for 10 minutes. Investigate identity, tenant-policy, client-version, or attack traffic changes."
          runbook_url: "https://runbooks.example.invalid/fraudfusion/auth-denial-spike"

      - alert: FraudFusionTokenLeakSignal
        expr: increase(fraudfusion_log_sensitive_data_matches_total{environment="production",classification="credential_material"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: fraudfusion-observability
        annotations:
          summary: "Potential credential material detected in application logs"
          description: "A production log entry matched a token-bearing pattern. Restrict access, rotate affected credentials, preserve evidence, and investigate immediately."
          runbook_url: "https://runbooks.example.invalid/fraudfusion/token-log-exposure"
