# Python fraud detectors (FastAPI). Both are fail-closed on Keycloak token
# introspection and require Postgres (DATABASE_URL).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-takeover-detector
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: account-takeover-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: account-takeover-detector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-takeover-detector
    spec:
      containers:
        - name: account-takeover-detector
          image: ghcr.io/munisp/fraudfusion/account-takeover-detector:latest
          env:
            - name: PORT
              value: "8092"
            - name: DB_HOST
              value: postgresql.fraudfusion-data.svc.cluster.local
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: detector-db, key: password}
            - name: DATABASE_URL
              value: postgresql://account_takeover_detector:$(DB_PASSWORD)@$(DB_HOST):5432/fraudfusion?sslmode=verify-full
            - name: KEYCLOAK_URL
              value: http://keycloak.fraudfusion-identity.svc.cluster.local:8080
            - name: KEYCLOAK_REALM
              value: fraudfusion
            - name: KEYCLOAK_CLIENT_ID
              value: account-takeover-detector
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: detector-db, key: keycloak-client-secret}
            - name: KEYCLOAK_REQUIRED_ROLES
              value: fraud_analyst,fraud_operator,admin
          ports:
            - name: http
              containerPort: 8092
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: account-takeover-detector
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: account-takeover-detector
spec:
  selector:
    app.kubernetes.io/name: account-takeover-detector
  ports:
    - name: http
      port: 8092
      targetPort: http
---
