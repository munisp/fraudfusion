# AML ML inference service (mlops/serving/aml_service.py) on port 8100.
# Closes the dangling AML_ML_SERVICE_URL reference in detectors.yaml.
# Build: docker build -f mlops/serving/Dockerfile -t ghcr.io/munisp/fraudfusion/aml-ml-service:latest .
# Model artifacts are optional; without them the service runs in its
# documented rule-fallback mode (model_mode=rule_fallback).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-ml-service
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: aml-ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aml-ml-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aml-ml-service
    spec:
      containers:
        - name: aml-ml-service
          image: ghcr.io/munisp/fraudfusion/aml-ml-service:latest
          env:
            - name: PORT
              value: "8100"
            # AML_MODEL_PATH / AML_ARTIFACT_DIR point at a mounted model
            # volume in production; absent here => rule-fallback mode.
            - name: AML_HIGH_RISK_THRESHOLD
              value: "0.8"
          ports:
            - name: http
              containerPort: 8100
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aml-ml-service
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: aml-ml-service
spec:
  selector:
    app.kubernetes.io/name: aml-ml-service
  ports:
    - name: http
      port: 8100
      targetPort: http
