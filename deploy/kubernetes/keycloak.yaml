# Keycloak identity provider for the fraudfusion realm.
# Realm is imported at startup from deploy/keycloak/fraudfusion-realm.json
# (mounted via ConfigMap). Postgres backend in fraudfusion-data.
apiVersion: v1
kind: Namespace
metadata:
  name: fraudfusion-identity
  labels:
    kubernetes.io/metadata.name: fraudfusion-identity
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak
  namespace: fraudfusion-identity
type: Opaque
stringData:
  # Override before deploying; these are placeholders, not working defaults.
  admin-username: CHANGE_ME
  admin-password: CHANGE_ME
  db-password: CHANGE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: fraudfusion-identity
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          # Version aligned with local-e2e/docker-compose.yml (keycloak:26.0).
          image: quay.io/keycloak/keycloak:26.0
          args:
            - start
            - --import-realm
            - --hostname-strict=false
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: {name: keycloak, key: admin-username}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak, key: admin-password}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgresql.fraudfusion-data.svc.cluster.local:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak, key: db-password}
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import/fraudfusion-realm.json
              subPath: fraudfusion-realm.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: realm
          configMap:
            name: fraudfusion-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: fraudfusion-identity
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The realm JSON is maintained at deploy/keycloak/fraudfusion-realm.json and
# loaded into this ConfigMap by kustomize/helm or:
#   kubectl -n fraudfusion-identity create configmap fraudfusion-realm \
#     --from-file=fraudfusion-realm.json=../keycloak/fraudfusion-realm.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraudfusion-realm
  namespace: fraudfusion-identity
  labels:
    app.kubernetes.io/name: keycloak
data:
  fraudfusion-realm.json: "" # populated from deploy/keycloak/fraudfusion-realm.json
