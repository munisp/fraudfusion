# Fraud detector services. All require Keycloak token introspection
# (fail-closed) and TLS-enabled Postgres (sslmode=verify-full).
apiVersion: v1
kind: Secret
metadata:
  name: detector-db
  namespace: fraudfusion-services
type: Opaque
stringData:
  # Override before deploying; placeholders, not working defaults.
  password: CHANGE_ME
  redis-password: ""
  keycloak-client-secret: CHANGE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-monitor
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: aml-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aml-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aml-monitor
    spec:
      containers:
        - name: aml-monitor
          image: ghcr.io/munisp/fraudfusion/aml-monitor:latest
          env:
            - name: PORT
              value: "8081"
            - name: DB_HOST
              value: postgresql.fraudfusion-data.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: aml_monitor
            - name: DB_NAME
              value: fraudfusion
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: detector-db, key: password}
            - name: DB_SSLMODE
              value: verify-full
            - name: REDIS_HOST
              value: redis.fraudfusion-data.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: detector-db, key: redis-password}
            - name: KEYCLOAK_URL
              # In-cluster plaintext HTTP on 8080 matches keycloak.yaml (TLS is
              # terminated at the ingress, not in-cluster). The detector auth
              # layer is fail-closed on non-HTTPS unless this flag is set.
              value: http://keycloak.fraudfusion-identity.svc.cluster.local:8080
            - name: KEYCLOAK_INSECURE_HTTP
              value: "true"
            - name: KEYCLOAK_REALM
              value: fraudfusion
            - name: KEYCLOAK_CLIENT_ID
              value: aml-monitor
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: detector-db, key: keycloak-client-secret}
            - name: AML_ML_SERVICE_URL
              value: http://aml-ml-service.fraudfusion-services.svc.cluster.local:8100
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /api/v1/aml/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aml-monitor
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: aml-monitor
spec:
  selector:
    app.kubernetes.io/name: aml-monitor
  ports:
    - name: http
      port: 8081
      targetPort: http
---
