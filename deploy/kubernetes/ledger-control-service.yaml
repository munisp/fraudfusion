apiVersion: v1
kind: Namespace
metadata:
  name: fraudfusion-financial
  labels:
    app.kubernetes.io/part-of: fraudfusion
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
  labels:
    app.kubernetes.io/name: ledger-control-service
    app.kubernetes.io/part-of: fraudfusion
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-control-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-control-service
        app.kubernetes.io/part-of: fraudfusion
    spec:
      serviceAccountName: ledger-control-service
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger-control-service
          image: registry.example.invalid/fraudfusion/ledger-control-service@sha256:<REPLACE_WITH_SIGNED_IMMUTABLE_DIGEST>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8098
          env:
            - name: LISTEN_ADDR
              value: ":8098"
          envFrom:
            - secretRef:
                name: ledger-control-service-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/ledger/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/ledger/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-control-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledger-control-service
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
  labels:
    app.kubernetes.io/name: ledger-control-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ledger-control-service
  ports:
    - name: http
      port: 8098
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ledger-control-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fraudfusion-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fraudfusion-financial
      ports:
        - protocol: TCP
          port: 8098
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fraudfusion-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fraudfusion-identity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
  annotations:
    kubernetes.io/ingress.class: <REPLACE_WITH_APPROVED_INGRESS_CLASS>
spec:
  tls:
    - hosts: [ledger-control.staging.example.invalid]
      secretName: ledger-control-service-tls
  rules:
    - host: ledger-control.staging.example.invalid
      http:
        paths:
          - path: /api/v1/ledger
            pathType: Prefix
            backend:
              service:
                name: ledger-control-service
                port:
                  name: http
