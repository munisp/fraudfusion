apiVersion: v1
kind: Namespace
metadata:
  name: fraudfusion-financial
  labels:
    app.kubernetes.io/part-of: fraudfusion
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
  labels:
    app.kubernetes.io/name: ledger-control-service
    app.kubernetes.io/part-of: fraudfusion
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-control-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-control-service
        app.kubernetes.io/part-of: fraudfusion
    spec:
      serviceAccountName: ledger-control-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ledger-control-service
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ledger-control-service
      containers:
        - name: ledger-control-service
          image: __LEDGER_IMAGE_REFERENCE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8098
          env:
            - name: LISTEN_ADDR
              value: ":8098"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-control-service-secrets
                  key: database-url
            - name: KEYCLOAK_INTROSPECTION_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-control-service-secrets
                  key: keycloak-introspection-url
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ledger-control-service-secrets
                  key: keycloak-client-id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ledger-control-service-secrets
                  key: keycloak-client-secret
            - name: SETTLEMENT_PROVIDER_NAME
              valueFrom:
                secretKeyRef:
                  name: ledger-control-service-secrets
                  key: settlement-provider-name
            - name: SETTLEMENT_PROVIDER_SUBMIT_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-control-service-secrets
                  key: settlement-provider-submit-url
            - name: SETTLEMENT_PROVIDER_ALLOWED_HOSTS
              valueFrom:
                secretKeyRef:
                  name: ledger-control-service-secrets
                  key: settlement-provider-allowed-hosts
            - name: SETTLEMENT_PROVIDER_CALLBACK_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: ledger-control-service-secrets
                  key: settlement-provider-callback-hmac-secret
            - name: HTTPS_PROXY
              value: http://ledger-egress-proxy.fraudfusion-egress.svc.cluster.local:8443
            - name: NO_PROXY
              value: .svc,.cluster.local,localhost,127.0.0.1
          startupProbe:
            httpGet:
              path: /api/v1/ledger/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/v1/ledger/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/ledger/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-control-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledger-control-service
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
  labels:
    app.kubernetes.io/name: ledger-control-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ledger-control-service
  ports:
    - name: http
      port: 8098
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ledger-control-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fraudfusion-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fraudfusion-financial
      ports:
        - protocol: TCP
          port: 8098
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fraudfusion-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fraudfusion-identity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fraudfusion-egress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ledger-egress-proxy
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledger-control-service
  namespace: fraudfusion-financial
  annotations:
    kubernetes.io/ingress.class: __LEDGER_INGRESS_CLASS__
spec:
  tls:
    - hosts: [__LEDGER_HOSTNAME__]
      secretName: __LEDGER_TLS_SECRET_NAME__
  rules:
    - host: __LEDGER_HOSTNAME__
      http:
        paths:
          - path: /api/v1/ledger
            pathType: Prefix
            backend:
              service:
                name: ledger-control-service
                port:
                  name: http
