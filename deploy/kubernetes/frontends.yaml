# Web frontends (static SPA bundles served by unprivileged nginx on 8080).
# Build each image from its directory, e.g.:
#   docker build -t ghcr.io/munisp/fraudfusion/journey-dashboard:latest frontend
# All four images share the same multi-stage Dockerfile pattern
# (node build -> nginxinc/nginx-unprivileged).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: journey-dashboard
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: journey-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: journey-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: journey-dashboard
    spec:
      containers:
        - name: journey-dashboard
          image: ghcr.io/munisp/fraudfusion/journey-dashboard:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: journey-dashboard
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: journey-dashboard
spec:
  selector:
    app.kubernetes.io/name: journey-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
---
