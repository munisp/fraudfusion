# AML ML inference service — CHALLENGER arm (mlops/serving/aml_service.py) on
# port 8100, pinned to model version v3 (AML_MODEL_VERSION=v3). This is the
# distinct Deployment/Service that the model-router's champion/challenger
# experiment config points at
# (deploy/kubernetes/model-router.yaml -> http://aml-ml-service-v2.../v1/aml/score);
# without it the challenger URL never resolved and 100% of traffic silently
# fell back to the champion.
# Same image as the champion (deploy/kubernetes/aml-ml-service.yaml):
#   docker build -f mlops/serving/Dockerfile -t ghcr.io/munisp/fraudfusion/aml-ml-service:latest .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-ml-service-v2
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: aml-ml-service-v2
    fraudfusion.io/experiment-arm: challenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aml-ml-service-v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aml-ml-service-v2
        fraudfusion.io/experiment-arm: challenger
    spec:
      containers:
        - name: aml-ml-service
          image: ghcr.io/munisp/fraudfusion/aml-ml-service:latest
          env:
            - name: PORT
              value: "8100"
            # Challenger model version; the champion Deployment serves v2.
            - name: AML_MODEL_VERSION
              value: "v3"
            # AML_MODEL_PATH / AML_ARTIFACT_DIR point at a mounted model
            # volume in production; absent here => rule-fallback mode.
            - name: AML_HIGH_RISK_THRESHOLD
              value: "0.8"
          ports:
            - name: http
              containerPort: 8100
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aml-ml-service-v2
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: aml-ml-service-v2
    fraudfusion.io/experiment-arm: challenger
spec:
  selector:
    app.kubernetes.io/name: aml-ml-service-v2
  ports:
    - name: http
      port: 8100
      targetPort: http
