# land-verification-service — landlord/property document verification
# (FastAPI, port 8002). Requires Keycloak bearer auth; persists to Postgres
# when DATABASE_URL is set, otherwise a local SQLite file (emptyDir here).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: land-verification-service
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: land-verification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: land-verification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: land-verification-service
    spec:
      containers:
        - name: land-verification-service
          image: ghcr.io/munisp/fraudfusion/land-verification-service:latest
          env:
            - name: PORT
              value: "8002"
            - name: LAND_VERIFY_REPORT_DIR
              value: /app/reports_out
            - name: DB_HOST
              value: postgresql.fraudfusion-data.svc.cluster.local
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: detector-db, key: password}
            - name: DATABASE_URL
              value: postgresql://land_verification_service:$(DB_PASSWORD)@$(DB_HOST):5432/fraudfusion?sslmode=verify-full
            - name: KEYCLOAK_URL
              value: http://keycloak.fraudfusion-identity.svc.cluster.local:8080
            - name: KEYCLOAK_REALM
              value: fraudfusion
          ports:
            - name: http
              containerPort: 8002
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: reports
              mountPath: /app/reports_out
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
        - name: reports
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: land-verification-service
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: land-verification-service
spec:
  selector:
    app.kubernetes.io/name: land-verification-service
  ports:
    - name: http
      port: 8002
      targetPort: http
