# Permify authorization service (ReBAC) with Postgres backend.
# The orchestrator bootstraps schema + seed relationships at startup via
# internal/permify Bootstrap (see orchestrator/go/internal/permify/schema.perm).
apiVersion: v1
kind: Secret
metadata:
  name: permify
  namespace: fraudfusion-identity
type: Opaque
stringData:
  # Override before deploying; placeholders, not working defaults.
  api-key: CHANGE_ME
  db-password: CHANGE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify
  namespace: fraudfusion-identity
  labels:
    app.kubernetes.io/name: permify
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: permify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: permify
    spec:
      containers:
        - name: permify
          image: ghcr.io/permify/permify:v1.2.9
          args: ["serve"]
          env:
            - name: PERMIFY_AUTHN_PRESHARED_KEYS
              valueFrom:
                secretKeyRef: {name: permify, key: api-key}
            - name: PERMIFY_DATABASE_ENGINE
              value: postgres
            - name: PERMIFY_DATABASE_URI
              value: postgres://permify:$(PERMIFY_DB_PASSWORD)@postgresql.fraudfusion-data.svc.cluster.local:5432/permify?sslmode=require
            - name: PERMIFY_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: permify, key: db-password}
            - name: PERMIFY_DATABASE_MAX_OPEN_CONNECTIONS
              value: "20"
          ports:
            - name: http
              containerPort: 3476
            - name: grpc
              containerPort: 3478
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: permify
  namespace: fraudfusion-identity
  labels:
    app.kubernetes.io/name: permify
spec:
  selector:
    app.kubernetes.io/name: permify
  ports:
    - name: http
      port: 3476
      targetPort: http
    - name: grpc
      port: 3478
      targetPort: grpc
