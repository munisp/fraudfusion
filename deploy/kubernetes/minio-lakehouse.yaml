# MinIO S3 object store for the lakehouse + model artifacts (DEV-GRADE).
#
# Backs the orchestrator's LAKEHOUSE_URL env
# (http://lakehouse.fraudfusion-data.svc.cluster.local:8090) — the Service is
# named "lakehouse" and exposes MinIO's S3 API (container 9000) as port 8090,
# so existing env wiring resolves unchanged. mlops/lakehouse + model artifact
# stores use the S3 API against this endpoint (AWS_ENDPOINT_URL style).
#
# Dev-grade means: single node, ephemeral emptyDir, no TLS, root credentials
# in a placeholder Secret. For production: distributed MinIO (4+ drives),
# PVCs, TLS, per-service IAM users/policies, bucket versioning + object lock.
apiVersion: v1
kind: Secret
metadata:
  name: lakehouse-minio
  namespace: fraudfusion-data
type: Opaque
stringData:
  # Override before deploying; placeholders, not working defaults.
  root-user: minioadmin
  root-password: CHANGE_ME_MINIO_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: fraudfusion-data
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-08-17T01-24-54Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: lakehouse-minio, key: root-user}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: lakehouse-minio, key: root-password}
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Dev-grade: ephemeral. Swap for a PVC in staging/prod.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lakehouse
  namespace: fraudfusion-data
  labels:
    app.kubernetes.io/name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      # LAKEHOUSE_URL consumers expect port 8090.
      port: 8090
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
# One-shot bucket bootstrap: creates the lakehouse + artifact buckets the
# mlops pipelines write to. Idempotent (mb --ignore-existing).
apiVersion: batch/v1
kind: Job
metadata:
  name: lakehouse-bucket-init
  namespace: fraudfusion-data
  labels:
    app.kubernetes.io/name: minio
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-08-13T05-33-17Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: lakehouse-minio, key: root-user}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: lakehouse-minio, key: root-password}
          command:
            - /bin/sh
            - -c
            - |
              mc alias set lake http://lakehouse:8090 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing lake/fraudfusion-lakehouse
              mc mb --ignore-existing lake/ml-artifacts
              mc anonymous set none lake/fraudfusion-lakehouse
              mc anonymous set none lake/ml-artifacts
