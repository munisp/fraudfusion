# MLflow tracking server (v2.20.2) with Postgres backend store, mirroring
# mlops/mlflow/docker-compose.yml. Namespace matches the rest of the stack.
#
# Wiring for the ml lane (ml/registry/register.py, ml/train/*):
#   export MLFLOW_TRACKING_URI=http://mlflow.fraudfusion-services.svc.cluster.local:5000
#
# Secrets: create before applying —
#   kubectl -n fraudfusion-services create secret generic mlflow-db \
#     --from-literal=POSTGRES_PASSWORD='<strong-password>'
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-db
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: mlflow
type: Opaque
stringData:
  # PLACEHOLDER — overridden by the sealed/external secret in real clusters;
  # compose equivalent default is MLFLOW_DB_PASSWORD.
  POSTGRES_PASSWORD: mlflow
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-db-data
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: mlflow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: mlflow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-db
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: mlflow-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: mlflow
            - name: POSTGRES_DB
              value: mlflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-db
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mlflow"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-db
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: mlflow-db
spec:
  selector:
    app.kubernetes.io/name: mlflow-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.20.2
          env:
            - name: MLFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-db
                  key: POSTGRES_PASSWORD
          command:
            - /bin/sh
            - -c
            - >
              mlflow server
              --host 0.0.0.0 --port 5000
              --backend-store-uri postgresql://mlflow:${MLFLOW_DB_PASSWORD}@mlflow-db:5432/mlflow
              --default-artifact-root /mlflow/artifacts
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: artifacts
              mountPath: /mlflow/artifacts
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: mlflow
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
