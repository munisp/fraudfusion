# kyc-api — CBN-tiered KYC verification service (services/python/kyc-api,
# FastAPI, port 8086). Auth is fail-closed Keycloak token introspection
# (KEYCLOAK_URL + realm + client credentials); persistence uses Postgres via
# DATABASE_URL (role `kyc_api`, see database/20260901_db_roles.sql) and falls
# back to a local SQLite file only when DATABASE_URL is unset.
# Build: docker build -f services/python/kyc-api/Dockerfile -t ghcr.io/munisp/fraudfusion/kyc-api:latest .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-api
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: kyc-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kyc-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyc-api
    spec:
      containers:
        - name: kyc-api
          image: ghcr.io/munisp/fraudfusion/kyc-api:latest
          env:
            - name: PORT
              value: "8086"
            - name: DB_HOST
              value: postgresql.fraudfusion-data.svc.cluster.local
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: detector-db, key: password}
            - name: DATABASE_URL
              value: postgresql://kyc_api:$(DB_PASSWORD)@$(DB_HOST):5432/fraudfusion?sslmode=verify-full
            # Keycloak token-introspection endpoint is derived as
            # $KEYCLOAK_URL/realms/$KEYCLOAK_REALM/protocol/openid-connect/token/introspect.
            - name: KEYCLOAK_URL
              value: http://keycloak.fraudfusion-identity.svc.cluster.local:8080
            - name: KEYCLOAK_REALM
              value: fraudfusion
            - name: KEYCLOAK_CLIENT_ID
              value: kyc-api
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: detector-db, key: keycloak-client-secret}
            # In-cluster Keycloak is plain HTTP; required or introspection
            # fails closed with 503. Remove once Keycloak serves TLS.
            - name: KEYCLOAK_INSECURE_HTTP
              value: "true"
          ports:
            - name: http
              containerPort: 8086
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        # Watchlist (WATCHLIST_PATH default data/watchlist.json) and the
        # SQLite fallback live here; emptyDir is fine because Postgres is the
        # production store.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kyc-api
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: kyc-api
spec:
  selector:
    app.kubernetes.io/name: kyc-api
  ports:
    - name: http
      port: 8086
      targetPort: http
