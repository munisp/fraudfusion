# Apache APISIX API gateway + etcd (standalone, DEV-GRADE).
#
# Backs the orchestrator's APISIX_ADMIN_URL env
# (http://apisix-admin.fraudfusion-gateway.svc.cluster.local:9180) — the admin
# Service is named "apisix-admin" so existing env wiring resolves unchanged.
#
# Topology: traditional deployment role — APISIX data+control plane backed by
# a single-node etcd. Dev-grade means: single replicas, no TLS on the admin
# API (in-cluster only, never expose 9180 outside the cluster), ephemeral
# etcd storage. The admin key ships as CHANGE_ME in the ConfigMap for local
# bring-up; override via the apisix Secret in real environments and set the
# orchestrator's apisix-api-key Secret to match.
apiVersion: v1
kind: Namespace
metadata:
  name: fraudfusion-gateway
  labels:
    kubernetes.io/metadata.name: fraudfusion-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: fraudfusion-gateway
  labels:
    app.kubernetes.io/name: etcd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.14
          command:
            - etcd
            - --name=etcd0
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd.fraudfusion-gateway.svc.cluster.local:2379
            - --data-dir=/etcd-data
          ports:
            - name: client
              containerPort: 2379
          readinessProbe:
            httpGet:
              path: /readyz
              port: client
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /etcd-data
      volumes:
        # Dev-grade: ephemeral. Swap for a PVC in staging/prod.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: fraudfusion-gateway
  labels:
    app.kubernetes.io/name: etcd
spec:
  selector:
    app.kubernetes.io/name: etcd
  ports:
    - name: client
      port: 2379
      targetPort: client
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: fraudfusion-gateway
data:
  config.yaml: |
    apisix:
      node_listen: 9080
      enable_admin: true
      allow_admin:
        # In-cluster admin API. Never expose 9180 via Ingress/LoadBalancer.
        - 0.0.0.0/0
    deployment:
      role: traditional
      role_traditional:
        config_provider: etcd
      admin:
        admin_key:
          # Dev placeholder — override via Secret-mounted config in real
          # environments; must match orchestrator Secret key apisix-api-key.
          - name: admin
            key: CHANGE_ME_APISIX_ADMIN_KEY
            role: admin
    etcd:
      host:
        - http://etcd.fraudfusion-gateway.svc.cluster.local:2379
      prefix: /apisix
      timeout: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: fraudfusion-gateway
  labels:
    app.kubernetes.io/name: apisix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix
    spec:
      containers:
        - name: apisix
          image: apache/apisix:3.9.1-debian
          ports:
            - name: gateway
              containerPort: 9080
            - name: admin
              containerPort: 9180
          readinessProbe:
            tcpSocket:
              port: gateway
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: apisix-config
---
# Gateway (data plane) service.
apiVersion: v1
kind: Service
metadata:
  name: apisix
  namespace: fraudfusion-gateway
  labels:
    app.kubernetes.io/name: apisix
spec:
  selector:
    app.kubernetes.io/name: apisix
  ports:
    - name: gateway
      port: 9080
      targetPort: gateway
---
# Admin (control plane) service — the name the orchestrator's APISIX_ADMIN_URL
# already points at.
apiVersion: v1
kind: Service
metadata:
  name: apisix-admin
  namespace: fraudfusion-gateway
  labels:
    app.kubernetes.io/name: apisix
spec:
  selector:
    app.kubernetes.io/name: apisix
  ports:
    - name: admin
      port: 9180
      targetPort: admin
