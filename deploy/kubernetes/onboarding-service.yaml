# onboarding-service — tenant/developer onboarding backend (FastAPI, :8085).
# Serves /api/v1/onboarding/* (ml-onboarding-portal) and the staff
# dual-control approval workflow under /api/v1/onboarding/admin/*.
# Schema: database/20260826_tenants_onboarding.sql.
apiVersion: v1
kind: Secret
metadata:
  name: onboarding-service
  namespace: fraudfusion-services
type: Opaque
stringData:
  # Override before deploying; placeholders, not working defaults.
  keycloak-client-secret: CHANGE_ME
  db-password: CHANGE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding-service
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: onboarding-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onboarding-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onboarding-service
    spec:
      containers:
        - name: onboarding-service
          image: ghcr.io/munisp/fraudfusion/onboarding-service:latest
          env:
            - name: PORT
              value: "8085"
            - name: DB_HOST
              value: postgresql.fraudfusion-data.svc.cluster.local
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: onboarding-service, key: db-password}
            - name: DATABASE_URL
              value: postgresql://onboarding_service:$(DB_PASSWORD)@$(DB_HOST):5432/fraudfusion?sslmode=verify-full
            - name: KEYCLOAK_URL
              # In-cluster plaintext HTTP on 8080 matches keycloak.yaml; TLS is
              # terminated at the ingress, not in-cluster.
              value: http://keycloak.fraudfusion-identity.svc.cluster.local:8080
            - name: KEYCLOAK_INSECURE_HTTP
              value: "true"
            - name: KEYCLOAK_REALM
              value: fraudfusion
            - name: KEYCLOAK_CLIENT_ID
              value: onboarding-service
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: onboarding-service, key: keycloak-client-secret}
            - name: ONBOARDING_ADMIN_ROLE
              value: onboarding_admin
          ports:
            - name: http
              containerPort: 8085
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: onboarding-service
  namespace: fraudfusion-services
  labels:
    app.kubernetes.io/name: onboarding-service
spec:
  selector:
    app.kubernetes.io/name: onboarding-service
  ports:
    - name: http
      port: 8085
      targetPort: http
