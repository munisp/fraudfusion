# PgBouncer connection pooler (DB4): 8+ services x 20-25 pool conns each
# would otherwise exhaust PostgreSQL max_connections. All services should
# point DATABASE_URL/DB_HOST at pgbouncer:6432 in transaction pooling mode.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels: { app: pgbouncer }
spec:
  replicas: 2
  selector:
    matchLabels: { app: pgbouncer }
  template:
    metadata:
      labels: { app: pgbouncer }
    spec:
      containers:
        - name: pgbouncer
          image: pgbouncer/pgbouncer:1.23
          ports:
            - containerPort: 6432
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
            - name: POOL_MODE
              value: transaction
            - name: MAX_CLIENT_CONN
              value: "1000"
            - name: DEFAULT_POOL_SIZE
              value: "25"
            - name: MAX_DB_CONNECTIONS
              value: "100"
            - name: SERVER_IDLE_TIMEOUT
              value: "600"
            - name: SERVER_LIFETIME
              value: "1800"
            - name: IGNORE_STARTUP_PARAMETERS
              value: extra_float_digits
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
          readinessProbe:
            tcpSocket: { port: 6432 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 6432 }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
spec:
  selector: { app: pgbouncer }
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: 6432
