# HorizontalPodAutoscalers for the latency-critical services.
# CPU-based scaling everywhere; the commented example shows the latency-aware
# custom-metric variant (requires prometheus-adapter exposing
# http_server_request_duration_seconds p95 per service).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crypto-fraud-detector
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: crypto-fraud-detector }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
