apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-command
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ledger-command }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
    # Latency-aware variant (prometheus-adapter required):
    # - type: Pods
    #   pods:
    #     metric:
    #       name: http_request_duration_p95_seconds
    #       selector:
    #         matchLabels: { service: ledger-command }
    #     target: { type: AverageValue, averageValue: 100m }  # scale when p95 > 100ms
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: orchestrator }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
