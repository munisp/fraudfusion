# Strategic-merge patch adding resource requests/limits to all service
# Deployments in the base manifests (detectors, ledger-command, orchestrator).
# Requests are sized from the latency budgets in perf/LATENCY_BUDGET.md:
# scoring pods need CPU headroom for rule evaluation + Redis/DB round trips.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-fraud-detector
spec:
  template:
    spec:
      containers:
        - name: crypto-fraud-detector
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
