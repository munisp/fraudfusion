# FraudFusion platform compose — python service mesh wiring.
#
# Boots the python services with the mesh registry env vars
# (services/python/integration/mesh.py) so every service can call every
# other service. Auth: Keycloak for user tokens; FRAUDFUSION_INTERNAL_TOKEN
# for service-to-service internal endpoints; KYC_API_KEY for scope-gated
# kyc-api calls from peers (issue a service key via onboarding-service).
#
# Postgres is the source of record (FRAUDFUSION_REQUIRE_POSTGRES=1).
# Optional AI sidecars (ollama + doc-intel) live in docker-compose.doc-intel.yml.

services:
  postgres:
    # PostGIS-enabled Postgres 16 (drop-in replacement): powers the geo
    # stack — geo_gazetteer geography columns, GiST indexes, ST_Distance.
    # On a plain postgres:16 the geo migration honestly falls back to
    # SQL haversine (see database/20261026_postgis_geo.sql).
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: fraudfusion
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    # Local-dev identity provider; the realm (fraudfusion) is imported from
    # deploy/keycloak/fraudfusion-realm.json. Production uses the k8s
    # manifest (deploy/kubernetes/keycloak.yaml) with TLS.
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/fraudfusion-realm.json:/opt/keycloak/data/import/fraudfusion-realm.json:ro
    ports: ["8080:8080"]

  intel-service:
    build: ../services/python/intel-service
    environment: &common
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/fraudfusion
      FRAUDFUSION_REQUIRE_POSTGRES: "1"
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      # Local-dev only: the compose Keycloak is plain HTTP. Never set in prod.
      KEYCLOAK_INSECURE_HTTP: ${KEYCLOAK_INSECURE_HTTP:-true}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-fraudfusion}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-fraudfusion}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      FRAUDFUSION_INTERNAL_TOKEN: ${FRAUDFUSION_INTERNAL_TOKEN:?set FRAUDFUSION_INTERNAL_TOKEN}
      # --- mesh registry: every peer address, so any service can call any other
      KYC_API_URL: http://kyc-api:8000
      LAND_SERVICE_URL: http://land-verification:8200
      INTEL_SERVICE_URL: http://intel-service:8500
      ONBOARDING_SERVICE_URL: http://onboarding-service:8300
      BACKOFFICE_API_URL: http://backoffice-api:8400
      BILLING_SERVICE_URL: http://billing-service:8600
      WEBHOOK_SERVICE_URL: http://webhook-service:8700
      WEBHOOK_INTERNAL_TOKEN: ${FRAUDFUSION_INTERNAL_TOKEN}
      KYC_API_KEY: ${KYC_SERVICE_API_KEY:-}
      DOC_INTEL_URL: http://doc-intelligence:8800
      FRAUD_SIGNALS_URL: http://fraud-signals:8900
      ACCOUNT_TAKEOVER_URL: http://account-takeover:8092
      OLLAMA_URL: http://ollama:11434
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8500:8500"]

  kyc-api:
    build: ../services/python/kyc-api
    environment: *common
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]

  land-verification:
    build: ../services/land-verification-service
    environment: *common
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8200:8200"]

  onboarding-service:
    build: ../services/python/onboarding-service
    environment: *common
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8300:8300"]

  backoffice-api:
    build: ../services/python/backoffice-api
    environment: *common
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8400:8400"]

  billing-service:
    build: ../services/python/billing-service
    environment: *common
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8600:8600"]

  webhook-service:
    build: ../services/python/webhook-service
    environment: *common
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8700:8700"]

  fraud-signals:
    build: ../services/python/fraud-signals
    environment: *common
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8900:8900"]

  account-takeover:
    build: ../services/python/account-takeover-detector
    environment:
      <<: *common
      KEYCLOAK_CLIENT_ID: account-takeover-detector
      KEYCLOAK_REQUIRED_ROLES: ${ATO_REQUIRED_ROLES:-fraud_analyst,service}
      ATO_ARTIFACT_DIR: /models/fraud_net
    volumes:
      - ../ml/artifacts/fraud_net/v1:/models/fraud_net:ro
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8092:8092"]

  # --- optional document-intelligence sidecars (profile: doc-intel) --------
  # Boot the full stack including AI document intelligence with:
  #   docker compose -f deploy/docker-compose.platform.yml --profile doc-intel up -d
  #   docker exec fraudfusion-ollama ollama pull qwen2.5vl:7b
  # The engine is fail-closed: a down sidecar reports "unavailable" in
  # provenance and contributes zero factors. (Merged from
  # docker-compose.doc-intel.yml, which is kept for standalone sidecar use.)
  ollama:
    image: ollama/ollama:latest
    container_name: fraudfusion-ollama
    profiles: ["doc-intel"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    # GPU strongly recommended for qwen2.5vl:7b (CPU works but 30-90s/page).
    restart: unless-stopped

  doc-intelligence:
    build:
      context: ../services/python/doc-verification
      dockerfile: ../../deploy/doc-intel.Dockerfile
    container_name: fraudfusion-doc-intel
    profiles: ["doc-intel"]
    environment:
      <<: *common
      OLLAMA_VISION_MODEL: qwen2.5vl:7b
      OLLAMA_TIMEOUT_S: "60"
      PADDLEOCR_ENABLED: "true"
    ports:
      - "8090:8090"
    depends_on:
      - ollama
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
  ollama-models:
