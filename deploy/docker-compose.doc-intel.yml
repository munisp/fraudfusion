# Round 16: document intelligence sidecars — ollama (Qwen2.5-VL) + the
# document intelligence engine with PaddleOCR enabled.
#
# Usage:
#   docker compose -f deploy/docker-compose.doc-intel.yml up -d
#   docker exec fraudfusion-ollama ollama pull qwen2.5vl:7b
#
# The engine stays fail-closed: if a sidecar is down, the corresponding
# layer reports "unavailable" in provenance and contributes zero factors.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: fraudfusion-ollama
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    # GPU strongly recommended for qwen2.5vl:7b (CPU works but 30-90s/page;
    # run the verify path async in that case).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]
    restart: unless-stopped

  doc-intelligence:
    build:
      context: ../services/python/doc-verification
      dockerfile: ../../deploy/doc-intel.Dockerfile
    container_name: fraudfusion-doc-intel
    environment:
      # Postgres is the source of record (Round 15 posture).
      DATABASE_URL: postgresql://fraudfusion:CHANGE_ME@postgres:5432/fraudfusion
      FRAUDFUSION_REQUIRE_POSTGRES: "1"
      # Round 16 backends:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_VISION_MODEL: qwen2.5vl:7b
      OLLAMA_TIMEOUT_S: "60"
      PADDLEOCR_ENABLED: "true"
    ports:
      - "8090:8090"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama-models:
