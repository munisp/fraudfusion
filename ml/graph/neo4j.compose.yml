# Neo4j compose FRAGMENT (not wired into the repo's main compose files —
# merge this service block into your local compose file to run a dev graph DB).
#
#   docker compose -f ml/graph/neo4j.compose.yml up -d
#   pip install neo4j
#   NEO4J_PASSWORD=password python -m ml.graph.neo4j_export
#   NEO4J_PASSWORD=password python -m ml.graph.neo4j_train
#
# Default credentials neo4j/password are DEV ONLY — override NEO4J_AUTH in any
# shared environment.
services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j-data:
