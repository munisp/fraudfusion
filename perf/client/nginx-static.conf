# nginx static-serving snippet for the FraudFusion Vite frontends
# (frontend, kyc-frontend, backoffice-ui, ml-onboarding-portal).
# Include per server block; adjust root per app.

# --- Compression -------------------------------------------------------------
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
  text/css
  text/javascript
  application/javascript
  application/json
  image/svg+xml
  font/woff2;
# If ngx_brotli is available, prefer it for static assets:
# brotli on; brotli_comp_level 5; brotli_types text/css application/javascript application/json image/svg+xml font/woff2;

# Optional: pre-compressed assets (vite-plugin-compression) can be served with:
# gzip_static on;  brotli_static on;

# --- Caching -----------------------------------------------------------------
# Vite emits content-hashed assets: safe to cache forever.
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

# index.html must revalidate every load so new deployments roll out instantly.
location / {
  add_header Cache-Control "no-cache, must-revalidate";
  try_files $uri $uri/ /index.html;   # SPA fallback (client-side routes)
}

# --- Security / correctness headers ------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
# Hidden sourcemaps are emitted but should not be served publicly:
location ~* \.map$ {
  deny all;
}
